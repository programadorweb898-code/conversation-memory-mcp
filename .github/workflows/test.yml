name: Test

on:
  push:
    branches:
      - main
      - hardening-transformers-migration
      - feature/automatic-engram-session-audit
      - feature/memory-audit-e2e
      - feature/memory-audit-resilience-tests
      - feature/memory-audit-engram-integration
      - feature/memory-audit-decision-states
      - feature/memory-promote-idempotency
      - feature/memory-promote-concurrency
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conversation_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conversation_memory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conversation_memory_test?sslmode=disable
      MCP_DEFAULT_OWNER: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile on branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/hardening-transformers-migration'
        run: |
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: regenerate lockfile for dependency updates"
          git push origin HEAD:${{ github.ref_name }}
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Run dependency audit
        run: npm audit --audit-level=critical
