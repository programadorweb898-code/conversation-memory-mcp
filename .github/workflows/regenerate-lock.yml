name: Dependency fix diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dry-run compatible audit fixes
        run: npm audit fix --dry-run --json > npm-audit-fix.json || true
      - name: Print remediation summary
        run: node -e "const a=require('./npm-audit-fix.json'); console.log(JSON.stringify({audit:a.audit,added:a.added,removed:a.removed,updated:a.updated,moved:a.moved,failed:a.failed},null,2));"
