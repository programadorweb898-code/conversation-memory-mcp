name: Regenerate lockfile
# temporary hardening workflow

on:
  push:
    branches:
      - hardening-dependency-security

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply compatible npm audit fixes
        run: npm audit fix --package-lock-only
      - name: Verify audit
        run: npm audit --json > npm-audit-after.json || true
      - name: Print audit summary
        run: node -e "const a=require('./npm-audit-after.json'); console.log(JSON.stringify({metadata:a.metadata, vulnerabilities:Object.fromEntries(Object.entries(a.vulnerabilities||{}).map(([n,v])=>[n,{severity:v.severity,fixAvailable:v.fixAvailable}]))},null,2));"
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: apply compatible npm audit fixes"
          git push
