name: Temp lock update
on:
  push:
    branches:
      - hardening-transformers-migration
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add package-lock.json && git diff --cached --quiet || git commit -m "chore: regenerate lockfile for dependency updates"
      - run: git push origin HEAD:${GITHUB_REF_NAME}
